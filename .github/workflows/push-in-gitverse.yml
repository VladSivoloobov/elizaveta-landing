name: Mirror to GitVerse

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  gitverse-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitVerse
        run: |
          git remote add gitverse https://ваш_логин_на_gitverse:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru/ваш_логин_на_gitverse/имя_репозитория.git
          git push --force --prune gitverse "+refs/remotes/origin/*:refs/heads/*" --tags
